<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Terminal</title>
    <script src="index.js" defer ></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=finance_mode" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="header">
        <div class="logo-group">
            <span class="material-symbols-outlined">finance_mode</span>
            <h3 id="name">Crypto Terminal</h3>
        </div>
        <h3>Markets</h3>
        <h3>Watchlist</h3>
        <h3>Community</h3>
    </header>

    <div id="table-container">

        <div id="my-watchlist" class="table-card">
            <div class="top-table">
                <h4 class="table-caption">My Watchlist</h4>
                <button id="add-coin-btn">+ Add Coin</button>
            </div>

            <table class="coins-table">
                <thead>
                    <tr>
                        <th>Asset</th>
                        <th>Price</th>
                        <th>Volume</th>
                        <th>24H%</th>
                    </tr>
                </thead>
                <tbody id="watchlist-body">
                </tbody>
            </table>
            </div>

            <div id="high-ticker" class="table-card">
                <div>
                    <h4 class="table-caption">TOP LEADERS</h4>
                </div>
                <table class="coins-table">
                    <thead>
                        <tr>
                            <th>Asset</th>
                            <th>Price</th>
                            <th>Volume</th>
                            <th>24H%</th>
                        </tr>
                    </thead>
                    <tbody id="gainers-body"></tbody>
                </table>
            </div>
            <div id="low-ticker" class="table-card">
                <div>
                    <h4 class="table-caption">TOP LOSERS</h4>
                </div>
                <table class="coins-table">
                    <thead>
                        <tr>
                            <th>Asset</th>
                            <th>Price</th>
                            <th>Volume</th>
                            <th>24H%</th>
                        </tr>
                    </thead>
                    <tbody id="losers-body"></tbody>
                </table>
            </div>
        </div>

    </div>


    <!-- <div id="socialBuzz"></div>
    <div id="research">
     coin info - rank, ath, symbol -->
    <!-- </div> -->

</body>
</html>
